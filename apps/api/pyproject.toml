[project]
name = "quant-prep-api"
version = "0.1.0"
description = "FastAPI backend for Quant Prep AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "lxml>=5.0.0",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.0",
  "pymupdf>=1.24.0",
  "python-multipart>=0.0.9",
  "requests>=2.32.0",
  "sqlalchemy>=2.0.36",
  "trafilatura>=1.12.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "types-requests>=2.32.0",
]
# Optional JS-rendered page fallback (QP-042). Install browsers separately:
#   pip install -e ".[playwright]" && playwright install chromium
playwright = [
  "playwright>=1.49.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "UP007", "UP035", "I001"]
"app/seeds/data/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
packages = ["app", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
  "bs4",
  "bs4.*",
  "fitz",
  "trafilatura",
  "trafilatura.*",
  "playwright",
  "playwright.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --cov=app --cov-report=term-missing --cov-report=xml"
markers = [
    "integration: tests that require a running PostgreSQL instance",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true
omit = [
  "app/seeds/*",
  "app/seeds/**/*",
]
